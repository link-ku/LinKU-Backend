spring:
  application:
    name: LinKU-Backend

  profiles:
    group:
      local: local, common
      prod: prod, common
    active: local

  jpa:
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  front:
    origin: ${FRONT_ORIGIN}

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

cloud:
  aws:
    s3:
      bucket-name: ${S3_BUCKET_NAME}
      bucket-url: ${S3_BUCKET_URL}
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    region:
      static: ${S3_REGION}

data-initialization:
  user:
    master:
      email: ${DATA_INIT_MASTER_EMAIL}
      password: ${DATA_INIT_MASTER_PASSWORD}

---
# Local profile
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        default_batch_fetch_size: 100

---
# Prod profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
---
# Common profile
spring:
  config:
    activate:
      on-profile: common
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope:
              - openid
              - profile
              - email
  sql:
    init:
      mode: always                # 항상 data.sql 실행
      encoding: UTF-8             # 파일 인코딩
      data-locations:             # sql 데이터의 경로
        - classpath:${DATA_LOCATION_SQL}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    auth-code-expiration-millis: 1800000  # 30분

logging:
  level:
    root: info
secret:
  jwt:
    key: ${JWT_KEY}
    access:
      expiration: 3600000
    refresh:
      expiration: 1209600000
