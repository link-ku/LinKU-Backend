spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:test_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: ca
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

# 테스트용 더미 값 설정
  front:
    origin: http://test.com
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            scope:
              - openid
              - profile
              - email
  mail:
    host: smtp.gmail.com
    port: 587
    username: test-mail@example.com
    password: test-mail-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    auth-code-expiration-millis: 1800000  # 30분

cloud:
  aws:
    s3:
      bucket-name: test-bucket
      bucket-url: http://test-url
    credentials:
      access-key: test-key
      secret-key: test-secret
    region:
      static: test-region

data-initialization:
  user:
    master:
      email: test@test.com
      password: test-password

secret:
  jwt:
    key: testtesttesttesttesttesttesttesttesttesttesttesttesttesttesttesttesttesttesttesttesttesttesttesttesttest
    access:
      expiration: 3600000
    refresh:
      expiration: 1209600000
